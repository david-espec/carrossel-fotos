name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # O app compara esta marca com versao.txt para saber quando ha uma
      # versao nova e se atualizar sozinho.
      - name: Marcar a versao
        run: |
          echo "$GITHUB_SHA" > versao.txt
          sed -i "s/__VERSAO__/$GITHUB_SHA/g" index.html
      # O app e um HTML so, sem build: publica a pasta como esta.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
