<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Escolha fotos da galeria e veja passando uma de cada vez, em tela cheia." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Carrossel" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>Carrossel de Fotos</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        background: #000;
        color: #f2f2f2;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      button { font: inherit; color: inherit; border: 0; cursor: pointer; }

      /* Tela inicial: escolher as fotos */
      #inicio {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
        text-align: center;
      }
      #inicio h1 { font-size: 26px; font-weight: 700; }
      #inicio p { color: #9a9a9a; font-size: 15px; max-width: 320px; line-height: 1.4; }
      .botao {
        width: 100%;
        max-width: 340px;
        padding: 16px 20px;
        border-radius: 14px;
        font-size: 17px;
        font-weight: 600;
        background: #222;
      }
      .botao.principal { background: #ffd166; color: #111; }
      .botao:disabled { opacity: .35; }

      #miniaturas {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
        gap: 6px;
        width: 100%;
        max-width: 340px;
        max-height: 40vh;
        overflow-y: auto;
      }
      #miniaturas img {
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        border-radius: 8px;
        background: #1a1a1a;
      }

      .opcoes { width: 100%; max-width: 340px; display: grid; gap: 14px; text-align: left; }
      .opcoes label { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; }
      .versao { color: #555; font-size: 12px; }
      .opcoes select {
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #333;
        background: #1a1a1a;
        color: #f2f2f2;
        font: inherit;
        font-size: 15px;
      }
      .opcoes input[type='checkbox'] { width: 22px; height: 22px; accent-color: #ffd166; }

      /* Carrossel em tela cheia */
      #palco {
        position: fixed;
        inset: 0;
        background: #000;
        overflow: hidden;
        display: none;
        touch-action: none;
      }
      #palco.ativo { display: block; }
      #faixa {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        display: flex;
        will-change: transform;
      }
      #faixa.deslizando { transition: transform .3s cubic-bezier(.2, .7, .2, 1); }
      #faixa img {
        flex: none;
        width: 100vw;
        height: 100%;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
      }
      #palco.preencher #faixa img { object-fit: cover; }

      /* Controles que aparecem ao tocar na tela */
      #controles {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        justify-content: center;
        gap: 12px;
        padding: 16px 16px max(20px, env(safe-area-inset-bottom));
        background: linear-gradient(transparent, rgba(0, 0, 0, .7));
        opacity: 0;
        pointer-events: none;
        transition: opacity .25s;
      }
      #palco.mostrar #controles { opacity: 1; pointer-events: auto; }

      /* Geracao do video para baixar */
      #gerando {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px 16px;
        background: #000;
        text-align: center;
      }
      #gerando[hidden] { display: none; }
      #gerando p { color: #9a9a9a; font-size: 14px; max-width: 320px; line-height: 1.4; }
      #gerando strong { font-size: 18px; }
      #barra { width: 100%; max-width: 340px; height: 8px; border-radius: 999px; background: #222; overflow: hidden; }
      #barra div { height: 100%; width: 0; background: #ffd166; }
      #previa { width: 100%; max-width: 200px; aspect-ratio: 9 / 16; border-radius: 12px; background: #111; }
      #controles button {
        padding: 12px 18px;
        border-radius: 999px;
        background: rgba(255, 255, 255, .16);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        font-size: 15px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main id="inicio">
      <h1>Carrossel de Fotos</h1>
      <p>Escolha as fotos da galeria e aperte OK. Elas passam uma de cada vez, da direita para a esquerda, em tela cheia.</p>

      <input id="arquivos" type="file" accept="image/*" multiple hidden />
      <button id="escolher" class="botao">Escolher fotos</button>

      <div id="miniaturas"></div>

      <div class="opcoes">
        <label>Velocidade
          <select id="tempo">
            <option value="1">Muito rápida (1 s)</option>
            <option value="2">Rápida (2 s)</option>
            <option value="3">Um pouco rápida (3 s)</option>
            <option value="4" selected>Normal (4 s)</option>
            <option value="6">Devagar (6 s)</option>
            <option value="8">Mais devagar (8 s)</option>
            <option value="12">Bem devagar (12 s)</option>
          </select>
        </label>
        <label>Preencher a tela (corta as bordas) <input id="preencher" type="checkbox" checked /></label>
        <label>Passar deslizando, como na galeria <input id="deslizar" type="checkbox" /></label>
      </div>

      <button id="ok" class="botao principal" disabled>OK</button>
      <button id="baixar" class="botao" disabled>Baixar como vídeo</button>
      <p class="versao">versão 5</p>
    </main>

    <div id="palco" class="preencher">
      <div id="faixa"></div>
      <div id="controles">
        <button id="pausar">Pausar</button>
        <button id="sair">Sair</button>
      </div>
    </div>

    <div id="gerando" hidden>
      <canvas id="previa" width="1080" height="1920"></canvas>
      <strong id="gerandoTitulo">Gerando o vídeo…</strong>
      <div id="barra"><div></div></div>
      <p id="gerandoTexto">Deixe esta tela aberta: o vídeo é gravado no tempo real das fotos.</p>
      <button id="salvar" class="botao principal" hidden>Salvar vídeo</button>
      <button id="cancelar" class="botao">Cancelar</button>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const inicio = $('inicio');
      const arquivos = $('arquivos');
      const miniaturas = $('miniaturas');
      const ok = $('ok');
      const palco = $('palco');
      const faixa = $('faixa');
      const tempo = $('tempo');
      const preencher = $('preencher');
      const deslizar = $('deslizar');
      const pausar = $('pausar');

      let urls = [];
      let atual = 0; // indice da foto na tela
      let pausado = false;
      let proxima = 0;
      let travaTela = null;
      let esconderControles = 0;

      const DESLIZE_MS = 300; // igual a transicao de #faixa.deslizando
      const esperaMs = () => Number(tempo.value) * 1000;

      $('escolher').addEventListener('click', () => arquivos.click());

      arquivos.addEventListener('change', () => {
        const novas = [...arquivos.files].filter((f) => f.type.startsWith('image/'));
        if (!novas.length) return;
        urls.forEach((u) => URL.revokeObjectURL(u));
        urls = novas.map((f) => URL.createObjectURL(f));
        miniaturas.replaceChildren(
          ...urls.map((src) => Object.assign(new Image(), { src, loading: 'lazy', decoding: 'async' }))
        );
        ok.disabled = false;
        $('baixar').disabled = false;
        ok.textContent = `OK (${urls.length} foto${urls.length > 1 ? 's' : ''})`;
      });

      preencher.addEventListener('change', () => palco.classList.toggle('preencher', preencher.checked));

      ok.addEventListener('click', comecar);

      function comecar() {
        // A primeira foto vai de novo no fim da faixa, para a volta da ultima
        // para a primeira tambem poder deslizar para a esquerda.
        const imgs = [...urls, urls[0]].map((src) =>
          Object.assign(new Image(), { src, decoding: 'async', draggable: false })
        );
        faixa.replaceChildren(...imgs);
        atual = 0;
        pausado = false;
        pausar.textContent = 'Pausar';
        inicio.hidden = true;
        palco.classList.add('ativo');
        posicionar();
        palco.requestFullscreen?.().catch(() => {});
        manterTelaLigada();
        agendar();
      }

      function posicionar(animado = false) {
        faixa.classList.toggle('deslizando', animado);
        faixa.style.transform = `translate3d(${-atual * window.innerWidth}px,0,0)`;
      }

      function agendar(extra = 0) {
        clearTimeout(proxima);
        if (!pausado && urls.length > 1) proxima = setTimeout(avancar, esperaMs() + extra);
      }

      // Depois da ultima foto, volta para a primeira. Sem deslizar, a troca e
      // instantanea; deslizando, a faixa corre ate a copia da primeira foto e
      // pula para a original sem ninguem ver.
      function avancar() {
        if (!deslizar.checked) {
          atual = (atual + 1) % urls.length;
          posicionar();
          agendar();
          return;
        }
        atual += 1;
        posicionar(true);
        if (atual === urls.length) {
          setTimeout(() => {
            atual = 0;
            posicionar();
          }, DESLIZE_MS);
        }
        agendar(DESLIZE_MS);
      }

      window.addEventListener('resize', () => palco.classList.contains('ativo') && posicionar());

      function sair() {
        clearTimeout(proxima);
        palco.classList.remove('ativo', 'mostrar');
        faixa.replaceChildren();
        inicio.hidden = false;
        if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
        travaTela?.release().catch(() => {});
        travaTela = null;
      }

      // Tocar na tela mostra os controles por alguns segundos.
      palco.addEventListener('click', (e) => {
        if (e.target.closest('#controles')) return;
        palco.classList.toggle('mostrar');
        clearTimeout(esconderControles);
        esconderControles = setTimeout(() => palco.classList.remove('mostrar'), 3000);
      });

      pausar.addEventListener('click', () => {
        pausado = !pausado;
        pausar.textContent = pausado ? 'Continuar' : 'Pausar';
        agendar();
      });
      $('sair').addEventListener('click', sair);

      // ---- Baixar como video ----
      // As fotos sao desenhadas num canvas em pe (1080x1920), do mesmo jeito que
      // passam na tela, e o MediaRecorder grava o canvas. Cada foto aparece uma
      // vez, na ordem; o video termina na ultima.
      const previa = $('previa');
      const gerando = $('gerando');
      const salvar = $('salvar');
      let gravacao = null; // { gravador, cancelado } da geracao em andamento
      let video = null; // { blob, nome }

      $('baixar').addEventListener('click', gerarVideo);
      $('cancelar').addEventListener('click', fecharGerando);
      salvar.addEventListener('click', salvarVideo);

      function formatoDoVideo() {
        if (!window.MediaRecorder) return null;
        const tipos = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
        return tipos.find((t) => MediaRecorder.isTypeSupported(t)) ?? null;
      }

      function carregar(src) {
        const img = new Image();
        img.src = src;
        return img.decode().then(() => img);
      }

      function desenharFoto(ctx, img, x) {
        const { width: W, height: H } = ctx.canvas;
        const escala = (preencher.checked ? Math.max : Math.min)(W / img.naturalWidth, H / img.naturalHeight);
        const w = img.naturalWidth * escala;
        const h = img.naturalHeight * escala;
        ctx.save();
        ctx.beginPath();
        ctx.rect(x, 0, W, H);
        ctx.clip();
        ctx.drawImage(img, x + (W - w) / 2, (H - h) / 2, w, h);
        ctx.restore();
      }

      async function gerarVideo() {
        const tipo = formatoDoVideo();
        if (!tipo || !previa.captureStream) {
          alert('Este navegador não consegue gerar vídeo. Tente pelo Chrome ou pelo Safari atualizado.');
          return;
        }
        video = null;
        salvar.hidden = true;
        $('cancelar').textContent = 'Cancelar';
        $('gerandoTitulo').textContent = 'Gerando o vídeo…';
        $('gerandoTexto').textContent = 'Deixe esta tela aberta: o vídeo é gravado no tempo real das fotos.';
        $('barra').firstElementChild.style.width = '0';
        gerando.hidden = false;
        manterTelaLigada();

        const atualGravacao = (gravacao = { gravador: null, cancelado: false });
        const fotos = await Promise.all(urls.map(carregar));
        if (atualGravacao.cancelado) return;
        const ctx = previa.getContext('2d');
        const W = previa.width;
        const espera = esperaMs();
        const deslize = deslizar.checked ? DESLIZE_MS : 0;
        const trecho = espera + deslize;
        const total = fotos.length * espera + (fotos.length - 1) * deslize;

        const gravador = new MediaRecorder(previa.captureStream(30), { mimeType: tipo, videoBitsPerSecond: 8_000_000 });
        const pedacos = [];
        atualGravacao.gravador = gravador;
        gravador.ondataavailable = (e) => e.data.size && pedacos.push(e.data);
        gravador.onstop = () => {
          if (atualGravacao.cancelado) return;
          const extensao = tipo.startsWith('video/mp4') ? 'mp4' : 'webm';
          video = { blob: new Blob(pedacos, { type: tipo.split(';')[0] }), nome: `carrossel.${extensao}` };
          $('gerandoTitulo').textContent = 'Vídeo pronto!';
          $('gerandoTexto').textContent = 'Toque em Salvar vídeo para guardar no celular.';
          salvar.hidden = false;
          $('cancelar').textContent = 'Fechar';
        };

        const desenhar = (t) => {
          ctx.fillStyle = '#000';
          ctx.fillRect(0, 0, W, previa.height);
          const i = Math.min(Math.floor(t / trecho), fotos.length - 1);
          const dentro = t - i * trecho;
          if (dentro <= espera || i === fotos.length - 1) {
            desenharFoto(ctx, fotos[i], 0);
          } else {
            const p = (dentro - espera) / deslize;
            const suave = 1 - Math.pow(1 - p, 3);
            desenharFoto(ctx, fotos[i], -suave * W);
            desenharFoto(ctx, fotos[i + 1], (1 - suave) * W);
          }
        };

        desenhar(0);
        gravador.start(1000);
        const inicioGravacao = performance.now();
        const quadro = () => {
          if (atualGravacao.cancelado) return;
          const t = performance.now() - inicioGravacao;
          desenhar(Math.min(t, total));
          $('barra').firstElementChild.style.width = `${Math.min(100, (t / total) * 100)}%`;
          if (t < total) requestAnimationFrame(quadro);
          else setTimeout(() => gravador.state !== 'inactive' && gravador.stop(), 200);
        };
        requestAnimationFrame(quadro);
      }

      function fecharGerando() {
        if (gravacao) {
          gravacao.cancelado = !video;
          if (gravacao.gravador && gravacao.gravador.state !== 'inactive') gravacao.gravador.stop();
          gravacao = null;
        }
        gerando.hidden = true;
        travaTela?.release().catch(() => {});
        travaTela = null;
      }

      // No celular, compartilhar abre a opcao "Salvar video" direto na galeria.
      // Onde nao da, baixa o arquivo.
      async function salvarVideo() {
        if (!video) return;
        const arquivo = new File([video.blob], video.nome, { type: video.blob.type });
        if (navigator.canShare?.({ files: [arquivo] })) {
          try {
            await navigator.share({ files: [arquivo] });
            return;
          } catch (e) {
            if (e.name === 'AbortError') return;
          }
        }
        const link = Object.assign(document.createElement('a'), {
          href: URL.createObjectURL(video.blob),
          download: video.nome,
        });
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(link.href), 60_000);
      }

      // Mantem a tela acesa enquanto as fotos passam (onde o navegador permitir).
      async function manterTelaLigada() {
        try {
          travaTela = await navigator.wakeLock?.request('screen');
        } catch {}
      }
      document.addEventListener('visibilitychange', () => {
        const emUso = palco.classList.contains('ativo') || !gerando.hidden;
        if (document.visibilityState === 'visible' && emUso) manterTelaLigada();
      });
    </script>
  </body>
</html>
